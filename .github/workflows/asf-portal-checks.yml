name: ASF Portal checks
on:
  push:
    paths:
      - 'portal/**'
      - '.github/workflows/asf-portal-checks.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/asf-portal-checks.yml'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check portal/app.js && node --check portal/config.js && node --check portal/academy-app.js && node --check portal/academy-filter.js && node --check portal/mp-data.js
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
          (python3 -m http.server 8000 >/tmp/asf-http.log 2>&1 &)
          node portal/smoke.spec.cjs
          node portal/academy-landing.spec.cjs
          node portal/flow.spec.cjs
          node portal/landing.spec.cjs
          node portal/recovery.spec.cjs
          node portal/ui-theme.spec.cjs
          node portal/access-requests.spec.cjs
      - name: Server cleanup policy tests
        run: node portal/purge.spec.cjs
      - name: Live Supabase Auth readiness
        run: node portal/auth-health.spec.cjs
      - name: Security regression guards
        run: |
          grep -q "kind='secret' and public.asf_is_commander()" portal/supabase/schema.sql
          grep -q "revoke insert on public.asf_reports" portal/supabase/02-report-submission.sql
          grep -q "report_kind is null or report_kind in" portal/supabase/schema.sql
          grep -q "and public.asf_approved()" portal/supabase/schema.sql
          grep -q "asf_check_email_webhook" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_commander_email_for_delivery" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_claim_due" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_finish" portal/supabase/functions/asf-notify/index.ts
          grep -q "Idempotency-Key" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_outbox" portal/supabase/17-durable-email-outbox.sql
          if grep -Eq 'NEW\\.(title|body|sender_name|discord_id)' portal/supabase/17-durable-email-outbox.sql; then
            echo 'Confidential report fields in email queue'; exit 1
          fi
          grep -q "grant execute on function public.asf_commander_email_for_delivery() to service_role" portal/supabase/16-commander-delivery-address.sql
          grep -q "app_private.asf_email_bridge_key" portal/supabase/15-email-webhook-bridge.sql
          if grep -Eq 'NEW\.(title|body|sender_name|discord_id)' portal/supabase/15-email-webhook-bridge.sql; then
            echo 'Forbidden private report fields in outbound webhook'; exit 1
          fi
