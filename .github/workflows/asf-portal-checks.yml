name: ASF Portal checks
on:
  push:
    paths:
      - 'portal/**'
      - 'js/courses.js'
      - 'js/banks/**'
      - '.github/workflows/asf-portal-checks.yml'
  pull_request:
    paths:
      - 'portal/**'
      - 'js/courses.js'
      - 'js/banks/**'
      - '.github/workflows/asf-portal-checks.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check portal/auth-client.js && node --check portal/app.js && node --check portal/mobile.js && node --check portal/confirmation.js && node --check portal/config.js && node --check portal/academy-app.js && node --check portal/academy-filter.js && node --check portal/mp-data.js && node --check portal/police-workspace.js && node --check portal/police-simple.spec.cjs && node --check portal/notice-center.js && node --check portal/notice-center.spec.cjs && node --check portal/mfa-commander.js && node --check portal/mfa-commander.spec.cjs && node --check portal/academy-demo.js && node --check portal/academy-demo.spec.cjs && node --check portal/auth-race.spec.cjs && node --check portal/auth-expiry.spec.cjs && node --check portal/auth-storage.spec.cjs
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
          (python3 -m http.server 8000 >/tmp/asf-http.log 2>&1 &)
          node portal/auth-session.spec.cjs
          node portal/auth-race.spec.cjs
          node portal/auth-expiry.spec.cjs
          node portal/smoke.spec.cjs
          node portal/academy-landing.spec.cjs
          node portal/flow.spec.cjs
          node portal/landing.spec.cjs
          node portal/recovery.spec.cjs
          node portal/signup.spec.cjs
          node portal/confirmation.spec.cjs
          node portal/ui-theme.spec.cjs
          node portal/access-requests.spec.cjs
          node portal/completion.spec.cjs
          node portal/mobile.spec.cjs
          node portal/responsibilities.spec.cjs
          node portal/departments.spec.cjs
          node portal/police-simple.spec.cjs
          node portal/notice-center.spec.cjs
          node portal/mfa-commander.spec.cjs
          node portal/academy-demo.spec.cjs
      - name: Mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-${{ github.sha }}
          path: /tmp/asf-mobile/
          if-no-files-found: ignore
      - name: Server cleanup policy tests
        run: node portal/auth-client.spec.cjs && node portal/auth-storage.spec.cjs && node portal/purge.spec.cjs
      - name: Academy receipts and legacy workflow regression
        run: |
          node --check portal/academy-config.js
          node --check portal/workflow-tools.js
          node --check portal/departments.js
          node portal/build-academy-catalog.cjs --check
          node portal/academy-results.spec.mjs
          node portal/workflow-tools.spec.cjs
          node portal/course-mail.spec.mjs
      - name: Live Supabase Auth readiness
        run: node portal/auth-health.spec.cjs && node portal/result-health.spec.cjs
      - name: Security regression guards
        run: |
          grep -q "kind='secret' and public.asf_is_commander()" portal/supabase/schema.sql
          grep -q "revoke insert on public.asf_reports" portal/supabase/02-report-submission.sql
          grep -q "report_kind is null or report_kind in" portal/supabase/schema.sql
          grep -q "and public.asf_approved()" portal/supabase/schema.sql
          grep -q "asf_check_email_webhook" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_commander_email_for_delivery" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_claim_due" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_finish" portal/supabase/functions/asf-notify/index.ts
          grep -q "Idempotency-Key" portal/supabase/functions/asf-notify/index.ts
          grep -q "asf_email_outbox" portal/supabase/17-durable-email-outbox.sql
          if grep -Eq 'NEW\\.(title|body|sender_name|discord_id)' portal/supabase/17-durable-email-outbox.sql; then
            echo 'Confidential report fields in email queue'; exit 1
          fi
          grep -q "grant execute on function public.asf_commander_email_for_delivery() to service_role" portal/supabase/16-commander-delivery-address.sql
          grep -q "app_private.asf_email_bridge_key" portal/supabase/15-email-webhook-bridge.sql
          grep -q "Activation reason is required before approval" portal/supabase/20-activation-reason-required.sql
          grep -q "where user_id=auth.uid() and status='pending'" portal/supabase/20-activation-reason-required.sql
          grep -q "revoke all on function public.asf_submit_activation_reason(text) from public,anon,authenticated" portal/supabase/20-activation-reason-required.sql
          grep -q "Only this department head can appoint its instructors" portal/supabase/migrations/20261103221000_departments_trainers_rewards.sql
          grep -q "Another supervisor must review your own reward" portal/supabase/migrations/20261103221000_departments_trainers_rewards.sql
          grep -q "check(amount=150000)" portal/supabase/migrations/20261103221000_departments_trainers_rewards.sql
          grep -q "asf_department_roles enable row level security" portal/supabase/migrations/20261103221000_departments_trainers_rewards.sql
          grep -q "revoke all on function public.asf_police_set_role(uuid,text,boolean)" portal/supabase/migrations/20261103225500_police_leadership_names_warning_lookup.sql
          grep -q "create trigger asf_guard_profile_name" portal/supabase/migrations/20261103225500_police_leadership_names_warning_lookup.sql
          grep -q "revoke all on public.asf_access_requests from public, anon, authenticated" portal/supabase/18-access-requests.sql
          grep -q "grant select on public.asf_access_requests to authenticated" portal/supabase/18-access-requests.sql
          grep -q "if auth.uid() is null or not public.asf_is_commander()" portal/supabase/18-access-requests.sql
          grep -q "perform public.asf_set_delegation" portal/supabase/18-access-requests.sql
          grep -q "access_decision" portal/supabase/19-access-request-notice-categories.sql
          grep -q "access_request" portal/supabase/19-access-request-notice-categories.sql
          if grep -Eq 'NEW\.(title|body|sender_name|discord_id)' portal/supabase/15-email-webhook-bridge.sql; then
            echo 'Forbidden private report fields in outbound webhook'; exit 1
          fi
