name: ASF live URL smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/asf-live-check.yml', 'portal/**', 'index.html']
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify portal and academy published
        shell: bash
        run: |
          set -euo pipefail
          URL="https://muhamid9397827.github.io/rass-academy"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --max-time 15 -o /tmp/asf-portal.html "$URL/portal/" &&
               curl -fLsS --max-time 15 -o /tmp/asf-academy.html "$URL/portal/academy.html" &&
               grep -q 'بوابة أمن المنشآت' /tmp/asf-portal.html &&
               grep -q 'أكاديمية أمن المنشآت' /tmp/asf-academy.html; then
              echo "ASF portal and academy are published and reachable"
              exit 0
            fi
            sleep 5
          done
          echo "ASF published URLs did not pass smoke test"
          exit 1
      - name: Read-only Auth and receipt service checks
        run: node portal/auth-health.spec.cjs && node portal/result-health.spec.cjs
